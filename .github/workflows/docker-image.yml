# Builds the two images on GitHub's runners (the 1 GiB server cannot run `next build`) and pushes
# them to GitHub Container Registry. The server then only pulls. See docs/deploy-aws.md.
name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image names (registry paths must be lowercase)
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/$owner/sehati-app" >> "$GITHUB_OUTPUT"
          echo "tools=ghcr.io/$owner/sehati-tools" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:latest
            ${{ steps.names.outputs.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: |
            ${{ steps.names.outputs.tools }}:latest
            ${{ steps.names.outputs.tools }}:${{ github.sha }}
          cache-from: type=gha
